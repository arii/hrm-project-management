# Publish the reviewed historical snapshot only. Never rebuild current main.
name: Deploy reviewed historical snapshot to Pages
on:
  push:
    branches: [deploy]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed deployment snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify snapshot files
        run: |
          test -f site/index.html
          test -f site/assets/index-DROI4gML.css
          test -f site/assets/index-sunset-8f2096f9e7.js
          test "$(find site -type f | wc -l)" -eq 3
          sha256sum --check site.sha256
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload reviewed static snapshot
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
